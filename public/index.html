<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Khybrio CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230d6e57%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2716%27 fill=%27white%27 text-anchor=%27middle%27%3EK%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky ledger header + tab rail; each tab is a working board, client opens in a side panel */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --sunk:#e8ece6; --line:#d3dad1; --fg:#17201b; --muted:#5b6a61;
  --accent:#0d6e57; --accent-ink:#ffffff; --accent-soft:#d7ece4;
  --ok:#1d7a46; --warn:#a86400; --bad:#b3261e;
  --st-early:#5d6f86; --st-mid:#5a4fb3; --st-late:#b06a00; --st-won:#0d6e57; --st-done:#2c3a33; --st-lost:#b3261e;
  --shadow:0 10px 30px rgba(20,32,27,.14);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101512; --panel:#171e1a; --sunk:#1e2722; --line:#2d3833; --fg:#e6ece8; --muted:#97a69d;
  --accent:#3cc29a; --accent-ink:#06231a; --accent-soft:#173a30;
  --ok:#4cc483; --warn:#e3a33b; --bad:#f2786f;
  --st-early:#93a6bf; --st-mid:#a59cf0; --st-late:#e3a33b; --st-won:#3cc29a; --st-done:#c5d0ca; --st-lost:#f2786f;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --panel:#171e1a; --sunk:#1e2722; --line:#2d3833; --fg:#e6ece8; --muted:#97a69d;
  --accent:#3cc29a; --accent-ink:#06231a; --accent-soft:#173a30;
  --ok:#4cc483; --warn:#e3a33b; --bad:#f2786f;
  --st-early:#93a6bf; --st-mid:#a59cf0; --st-late:#e3a33b; --st-won:#3cc29a; --st-done:#c5d0ca; --st-lost:#f2786f;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:20px}
.brand .tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn);animation:pulse 1s infinite} .dot.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .badge{font-family:var(--f-mono);font-size:11px;background:var(--sunk);border-radius:99px;padding:0 6px;color:var(--fg)}
nav.tabs .badge.hot{background:var(--bad);color:#fff}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.55;cursor:default}

main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px;max-width:1400px;margin:0 auto}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--panel);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.bad{border-left-color:var(--bad)}
.banner p{margin:0;flex:1;min-width:220px}

.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-head h2{font-size:18px;margin-right:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.15}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.alert .val{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.ftrack{height:22px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
.ffill{height:100%;border-radius:6px;min-width:2px}
.fcount{position:absolute;left:8px;top:2px;font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.fval{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:520px){.frow{grid-template-columns:96px minmax(0,1fr) 72px}}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px 1px 7px;font-size:12px;font-weight:500;white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--muted)) 15%,transparent);color:var(--c,var(--muted))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-early{--c:var(--st-early)} .s-mid{--c:var(--st-mid)} .s-late{--c:var(--st-late)} .s-won{--c:var(--st-won)} .s-done{--c:var(--st-done)} .s-lost{--c:var(--st-lost)}
.f-over{--c:var(--bad)} .f-today{--c:var(--warn)} .f-up{--c:var(--muted)} .f-ok{--c:var(--ok)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .t{font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.li .t:hover{color:var(--accent)}
.li .m{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);padding:18px 0;text-align:center;font-size:13px}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
td.r,th.r{text-align:right}
td.wrapcell{white-space:normal;min-width:180px}
tfoot td{font-weight:600;background:var(--sunk);cursor:default}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;min-width:0}
.filters input{flex:1 1 200px}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--sunk);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 230px);min-height:140px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.colhead{padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.colhead .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.colhead .sum{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cards{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:grab;display:flex;flex-direction:column;gap:5px}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard .nm{font-weight:600;overflow-wrap:anywhere}
.kcard .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kcard select{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 4px;align-self:flex-start}
.drophint{font-size:12px;color:var(--muted);text-align:center;padding:12px 4px}

/* follow-ups */
.fugroup{display:flex;flex-direction:column;gap:8px}
.fugroup h3{font-size:15px;display:flex;gap:8px;align-items:center}
.furow{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.furow .nm{font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.furow .nm:hover{color:var(--accent)}
.furow .info{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.furow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.furow{grid-template-columns:1fr}.furow .acts{justify-content:flex-start}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.dhead .row{display:flex;gap:10px;align-items:flex-start}
.dhead h2{font-size:22px;flex:1;overflow-wrap:anywhere}
.dbody{overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px}
.stagepick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stagepick select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-weight:600}
.actions{display:flex;gap:6px;flex-wrap:wrap}
dl.details{display:grid;grid-template-columns:130px minmax(0,1fr);gap:7px 12px;margin:0;font-size:13.5px}
dl.details dt{color:var(--muted)}
dl.details dd{margin:0;overflow-wrap:anywhere}
.subhead{display:flex;align-items:center;gap:8px}
.subhead h3{font-size:15px;margin-right:auto}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 14px 16px}
.tl::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.tl .when{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tl .what{font-weight:600}
.tl .det{font-size:13px;color:var(--muted);white-space:pre-wrap}
.mini{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.mini .mr{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.mini .mr:first-child{border-top:0}
.mini .mr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.mini .mr .no{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.mini .mr .amt{margin-left:auto;font-family:var(--f-mono);font-size:12.5px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:rgba(10,16,13,.5)}
.sheet{background:var(--panel);border-radius:14px;width:min(620px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet header h2{font-size:18px;flex:1}
.sheet form{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.sheet footer{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet footer .note{font-size:12px;color:var(--muted);margin-right:auto;min-width:0}
.formerr{grid-column:1/-1;color:var(--bad);font-size:13px}
@media (max-width:560px){.sheet form{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);font-size:13.5px;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.files a{color:var(--accent)}
a{color:var(--accent)}
.skel{color:var(--muted)}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.loginbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.loginbox h1{font-size:26px}.loginbox p{margin:0}
.loginbox input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>Khybrio CRM</h1><span class="tag">Khybrio Records</span></div>

      <button type="button" role="tab" data-tab="won">Deals won</button>
      <button type="button" role="tab" data-tab="billing">Quotes &amp; billing</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main">

  <section id="view"></section>
</main>

<div id="drawerHost"></div>
<div id="modalHost"></div>
<div id="toastHost"></div>

/* ---------- Airtable I/O (through /api/records) ---------- */
async function api(method,payload,table){
  const url=method==="GET"?"/api/records?table="+encodeURIComponent(table):"/api/records";
  const r=await fetch(url,{method,headers:payload?{"Content-Type":"application/json"}:{},body:payload?JSON.stringify(payload):undefined,credentials:"same-origin"});
  if(r.status===401){showLogin("Your session ended. Log in again.");const e=new Error("login");e.code="login";throw e}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.message||("Server error "+r.status));e.code=j.error||"http";throw e}
  return j}

    res.forEach(([t,p])=>{S[t]=(p.records||[]).map(r=>norm(t,r));loaded[t]=true});
    lastSync=Date.now();clearBanner();render()}
  catch(e){if(e.code!=="login")showBanner(e.code,e.code==="not_configured"?e.message:"Couldn't load from Airtable: "+e.message+(lastSync?". Showing what was loaded earlier.":""))}
  finally{loading=false;setSync()}}

      sub("Invoices","invoice",mini("IN","invoice",S.IN.filter(x=>x.client.includes(c.id)),"amount",payStatus))));
  host.replaceChildren(h("div",{class:"scrim",onclick:closeClient}),drawer);
  const body=drawer.querySelector(".dbody");if(body)body.scrollTop=keepScroll}

/* ---------- routing & render ---------- */
const VIEWS={overview:viewOverview,pipeline:viewPipeline,leads:viewLeads,followups:viewFollowups,won:viewWon,billing:viewBilling};
function go(t){if(!VIEWS[t])t="overview";tab=t;try{history.replaceState(null,"","#"+t)}catch(e){}try{localStorage.setItem("kcrm_tab",t)}catch(e){}render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  $("#bLeads").textContent=String(openClients().length);
  const due=dueList().length,bf=$("#bFu");bf.textContent=String(due);bf.className="badge"+(due?" hot":"");
  if(document.activeElement&&document.activeElement.id==="leadSearch"&&tab==="leads"){}
  $("#view").replaceChildren(VIEWS[tab]());
  if(openClient)renderDrawer()}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b)go(b.dataset.tab)});
$("#newLeadBtn").addEventListener("click",()=>openForm("lead"));
$("#refreshBtn").addEventListener("click",()=>{if(!authed)return showLogin();loadAll();toast("Refreshing from Airtable…")});
$("#logoutBtn").addEventListener("click",async()=>{try{await fetch("/api/logout",{method:"POST"})}catch(e){}for(const k in S){S[k]=[];loaded[k]=false}lastSync=null;closeClient();render();showLogin()});

let start=(location.hash||"").slice(1);if(!VIEWS[start]){try{start=localStorage.getItem("kcrm_tab")||"overview"}catch(e){start="overview"}}
tab=VIEWS[start]?start:"overview";render();setSync();
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(VIEWS[t]&&t!==tab)go(t)});
setInterval(()=>{if(authed&&!document.hidden&&!busy)loadAll()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&authed)loadAll()});
(async()=>{try{const r=await fetch("/api/login");const j=await r.json();if(j.loggedIn){authed=true;$("#logoutBtn").hidden=false;loadAll()}else showLogin()}catch(e){showLogin("Couldn't reach the server.")}})();
})();
</script>
</body>
</html>
